// Real, theme-matched photography via LoremFlickr (keyword-based, Creative Commons licensed).
// `variant` lets the same subject (e.g. a hotel) show several different real photos in a gallery
// while staying deterministic (same seed+variant always returns the same photo, no reshuffling on reload).
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; } return h; }
const img = (seed,w=800,h=600,variant=0) => {
  const lock = (hashStr(seed+'::'+variant) % 9000) + 1;
  // keywords stay comma-separated and unencoded — LoremFlickr reads the commas as OR-matched tags
  return `https://loremflickr.com/${w}/${h}/${seed}?lock=${lock}`;
};

// Deterministic "live availability" indicator so numbers don't reshuffle on every render.
function availabilityFor(id, max=12, min=2){
  const h = hashStr('avail::'+id);
  return (h % (max-min+1)) + min;
}

    return opts ? `<optgroup label="${cont}">${opts}</optgroup>` : '';
  }).join('');
}

// Circular distance between continents (0 = same continent, up to 3 = furthest apart) —
// used as a simple, deterministic stand-in for real-world flight distance.
function continentGap(c1,c2){
  if(c1===c2) return 0;
  const i1=CONTINENT_ORDER.indexOf(c1), i2=CONTINENT_ORDER.indexOf(c2);
  const raw = Math.abs(i1-i2);
  return Math.min(raw, CONTINENT_ORDER.length-raw);
}
function durationMinutes(s){ const m=s.match(/(\d+)h\s*(\d+)m/); return m ? (+m[1]*60 + +m[2]) : 0; }

// Deterministically generates a realistic-looking set of flights for any From/To/cabin
// combination, with duration, stops and pricing scaled by how far apart the continents are —
// so short regional hops stay non-stop and cheap, while intercontinental routes get layovers
// and higher fares. Regenerating with the same inputs always returns the same flights, which
// lets booking (itemAndPrice) recreate a specific flight from its id without storing state.
function generateFlights(fromCode, toCode, cabinId){
  const from = airportByCode(fromCode), to = airportByCode(toCode);
  const cabin = CABIN_CLASSES.find(c=>c.id===cabinId) || CABIN_CLASSES[0];
  const gap = continentGap(from.continent, to.continent);
  const baseHours = gap===0 ? 1.5 : [0,5.5,10,15][gap];
  const layoverHubs = ['Dubai','Singapore','Doha','Istanbul','Amsterdam','Bangkok'];
  const count = 6;
  const list = [];
  for(let i=0;i<count;i++){
    const h = hashStr(`${fromCode}-${toCode}-${cabinId}-${i}`);
    const airline = AIRLINE_POOL[h % AIRLINE_POOL.length];
    const durHours = baseHours + (h % 5) * 0.6;
    const stopsCount = fromCode===toCode ? 0 : gap===0 ? (h%4===0?1:0) : gap===1 ? (h%3===0?0:1) : (h%3===0?1:2);
    const depH = 5 + (h % 17), depM = (h*7) % 60;
    const dep = `${String(depH).padStart(2,'0')}:${String(depM).padStart(2,'0')}`;
    const arrTotal = depH*60 + depM + Math.round(durHours*60);
    const arr = `${String(Math.floor(arrTotal/60)%24).padStart(2,'0')}:${String(arrTotal%60).padStart(2,'0')}`;
    const hrs = Math.floor(durHours), mins = Math.round((durHours-hrs)*60);
    const layover = stopsCount>0 ? layoverHubs[h % layoverHubs.length] : null;
    const basePrice = 3500 + gap*6500 + (h%9)*450;
    const price = Math.round(basePrice*cabin.multiplier/50)*50;
    list.push({
      id:`f-${fromCode}-${toCode}-${cabinId}-${i}`,
      airline: airline.name, color: airline.color,
      dep, arr, duration:`${hrs}h ${mins}m`,
      stopsCount,
      stops: stopsCount===0?'Non-stop':stopsCount===1?`1 stop · ${layover}`:`2 stops · via ${layover}`,
      cabin: cabin.label,
      baggage: cabinId==='economy' ? '15 kg check-in + 7 kg cabin' : cabinId==='premium' ? '25 kg check-in + 10 kg cabin' : '32 kg check-in + 12 kg cabin',
      price,
      from: from.city, fromCode, to: to.city, toCode,
    });
  }
  return list;
}

/* =========================================================
   HELPERS
   ========================================================= */
function money(n){ return '₹' + n.toLocaleString('en-IN'); }
function stars(rating){
  const full = Math.round(rating);
  return '★'.repeat(full) + '☆'.repeat(5-full);
}
function go(hash){ location.hash = hash; window.scrollTo({top:0,behavior:'smooth'}); }
function qs(sel,root=document){ return root.querySelector(sel); }
function qsa(sel,root=document){ return [...root.querySelectorAll(sel)]; }
function bookingId(){ return 'TRV' + Math.floor(100000 + Math.random()*899999); }
function applyTheme(){ document.documentElement.classList.toggle('dark', state.darkMode); }
function toggleDarkMode(){ state.darkMode = !state.darkMode; applyTheme(); render(); }

/* =========================================================
   HEADER / FOOTER
   ========================================================= */
function renderHeader(){
  const nav = [
    ['Flights','#/flights'], ['Hotels','#/hotels'], ['Cabs','#/cabs'],
    ['Packages','#/packages'], ['Activities','#/activities'],
  ];
  return `
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <a href="#/" class="flex items-center gap-1.5 text-xl font-extrabold text-brand-700 shrink-0">
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none" class="shrink-0">
          <circle cx="16" cy="16" r="14.5" stroke="currentColor" stroke-width="2"/>
          <path d="M16 6l4 9-4 3-4-3 4-9z" fill="currentColor"/>
          <path d="M16 26l-4-9 4-3 4 3-4 9z" fill="currentColor" opacity=".35"/>
        </svg>
        FlyVenture
      </a>
      <nav class="hidden lg:flex items-center gap-7 text-sm font-medium text-slate-600">
        ${nav.map(([label,href])=>`<a href="${href}" class="hover:text-brand-600 transition-colors">${label}</a>`).join('')}
        <div class="relative group">
          <button class="flex items-center gap-1 hover:text-brand-600 transition-colors">More
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <div class="absolute left-0 top-full pt-2 hidden group-hover:block">
            <div class="w-52 bg-white rounded-xl shadow-lg border border-slate-100 py-2">
              ${[['Tour Guides','#/guides'],['Bus Tickets','#/more/bus'],['Train Tickets','#/more/train'],['Car Rentals','#/more/car-rentals'],['Airport Transfers','#/more/airport-transfers'],['About Us','#/about']]
                .map(([l,h])=>`<a href="${h}" class="block px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-brand-600">${l}</a>`).join('')}
            </div>
          </div>
        </div>
      </nav>
      <div class="flex items-center gap-3 shrink-0">
        <button data-action="toggle-theme" aria-label="Toggle dark mode" title="Toggle dark mode" class="theme-toggle w-9 h-9 rounded-full border border-slate-200 flex items-center justify-center text-slate-600 hover:text-brand-600 hover:border-brand-300 transition-colors">
          ${state.darkMode
            ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.2M12 19.8V22M4.2 4.2l1.55 1.55M18.25 18.25l1.55 1.55M2 12h2.2M19.8 12H22M4.2 19.8l1.55-1.55M18.25 5.75l1.55-1.55" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`
            : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 119.5 4a7 7 0 0010.5 10.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`}
        </button>
        ${state.user ? `
          <div class="relative group">
            <button class="flex items-center gap-2 text-sm font-medium text-slate-700">
              <span class="w-8 h-8 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center font-semibold">${state.user.name[0]}</span>
              <span class="hidden sm:inline">${state.user.name.split(' ')[0]}</span>
            </button>
            <div class="absolute right-0 top-full pt-2 hidden group-hover:block">
              <div class="w-44 bg-white rounded-xl shadow-lg border border-slate-100 py-2">
                <a href="#/account" class="block px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">My Account</a>
                <a href="#/admin" class="block px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Admin Panel</a>
                <button data-action="logout" class="w-full text-left px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Logout</button>
              </div>
            </div>
          </div>
        ` : `
          <button data-action="open-login" class="hidden sm:block text-sm font-semibold text-brand-700 border border-brand-200 rounded-full px-5 py-2 hover:bg-brand-50 transition-colors">Login / Sign up</button>
          <button data-action="open-login" class="sm:hidden text-sm font-semibold text-brand-700">Login</button>
        `}
        <button data-action="toggle-mobile-nav" class="lg:hidden p-2 text-slate-600">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div id="mobile-nav" class="hidden lg:hidden border-t border-slate-100 px-4 py-3 space-y-1">
      ${nav.map(([label,href])=>`<a href="${href}" class="block py-2 text-sm font-medium text-slate-600">${label}</a>`).join('')}
      <a href="#/guides" class="block py-2 text-sm font-medium text-slate-600">Tour Guides</a>
      <a href="#/more/bus" class="block py-2 text-sm font-medium text-slate-600">Bus Tickets</a>
      <a href="#/more/train" class="block py-2 text-sm font-medium text-slate-600">Train Tickets</a>
      <a href="#/more/car-rentals" class="block py-2 text-sm font-medium text-slate-600">Car Rentals</a>
      <a href="#/more/airport-transfers" class="block py-2 text-sm font-medium text-slate-600">Airport Transfers</a>
      <a href="#/about" class="block py-2 text-sm font-medium text-slate-600">About Us</a>
    </div>
  </header>`;
}

  if(sort==='cheapest') list.sort((a,b)=>a.price-b.price);

function bindHotelsResults(){
  qs('[data-filter="maxPrice"]')?.addEventListener('input',e=>{ state.filters.hotel.maxPrice=+e.target.value; render(); });
  qsa('[data-filter="minRating"]').forEach(el=>el.addEventListener('change',e=>{ state.filters.hotel.minRating=+e.target.value; render(); }));
  qsa('[data-filter="amenity"]').forEach(el=>el.addEventListener('change',e=>{
    const v=e.target.value; const arr=state.filters.hotel.amenities;
    state.filters.hotel.amenities = e.target.checked ? [...arr,v] : arr.filter(x=>x!==v);
    render();
  }));
  qsa('[data-filter="type"]').forEach(el=>el.addEventListener('change',e=>{
    const v=e.target.value; const arr=state.filters.hotel.types;
    state.filters.hotel.types = e.target.checked ? [...arr,v] : arr.filter(x=>x!==v);
    render();
  }));
  qsa('[data-hotel-city]').forEach(b=>b.addEventListener('click',()=>{ state.filters.hotel.city=b.dataset.hotelCity; render(); }));
  qs('[data-action="reset-hotel-filters"]')?.addEventListener('click',()=>{
    state.filters.hotel = {maxPrice:30000, minRating:0, amenities:[], city:'All', types:[]};
    render();
  });
}

   ========================================================= */
function itemAndPrice(type,id,meta){
  const maps = {
    flight: ()=>{
      const [,fromCode,toCode,cabinId,iStr] = id.split('-');
      const f = generateFlights(fromCode,toCode,cabinId)[+iStr];
      return {title:`${f.airline} — ${f.from} to ${f.to}`, sub:`${f.dep} – ${f.arr} · ${f.duration} · ${f.cabin} · ${f.stops}`, price:f.price};
    },
    hotel: ()=>{ const h=HOTELS.find(x=>x.id===id); return {title:h.name, sub:`${meta?.room||'Deluxe Room'} · ${h.location}`, price:meta?.price||h.price}; },
    cab: ()=>{ const c=CABS.find(x=>x.id===id); return {title:c.name, sub:`${c.seats} seats · ${c.type}`, price:c.price}; },
    package: ()=>{ const p=PACKAGES.find(x=>x.id===id); return {title:p.name, sub:`${p.destination} · ${p.days} days`, price:p.price}; },
    activity: ()=>{ const a=ACTIVITIES.find(x=>x.id===id); return {title:a.name, sub:`${a.location} · ${a.duration}`, price:a.price}; },
    guide: ()=>{ const g=GUIDES.find(x=>x.id===id); return {title:g.name, sub:`${g.location} guide · per ${g.unit}`, price:g.price}; },
  };
  return maps[type] ? maps[type]() : {title:'Item', sub:'', price:0};
}

function startBooking(type,id,meta){
  if(!state.user){
    state.pendingBooking = {type,id,meta};

  go('#/booking');
}

function bindBooking(){
  qs('#traveller-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    state.currentBooking.traveller = { name:fd.get('name'), email:fd.get('email'), phone:fd.get('phone') };
    state.currentBooking.step = 2;
    render();
  });
  qsa('[data-action="prev-step"]').forEach(b=>b.addEventListener('click',()=>{ state.currentBooking.step -= 1; render(); }));
  qsa('[data-action="next-step"]').forEach(b=>b.addEventListener('click',()=>{ state.currentBooking.step += 1; render(); }));
  qs('#payment-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    const b = state.currentBooking;
    const item = itemAndPrice(b.type,b.itemId,b.meta);
    const record = {
      id: bookingId(), type:b.type, title:item.title, sub:item.sub,
      price: item.price + Math.round(item.price*0.08),
      traveller: b.traveller, date: new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}),
      status:'Confirmed',
    };
    state.bookings.unshift(record);
    state.lastBooking = record;
    state.currentBooking = null;
    go('#/confirmation');
  });
}

  overlay.innerHTML = `

      <form id="login-form" class="mt-5 space-y-3">

          <label class="block text-xs font-medium text-slate-500 mb-1">Full name</label>
          <input required name="name" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm" placeholder="Aditi Sharma">

        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Email</label>
          <input required type="email" name="email" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm" placeholder="you@email.com">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Password</label>
          <input required type="password" name="password" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg py-2.5 text-sm transition-colors">Login / Sign up</button>
      </form>
      <p class="text-[11px] text-slate-400 text-center mt-3">Prototype login — any details will work.</p>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{ if(e.target===overlay) closeLoginModal(); });
  qs('#close-login',overlay);
  overlay.querySelector('[data-action="close-login"]').addEventListener('click', closeLoginModal);
  overlay.querySelector('#login-form').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);

      startBooking(type,id,meta);
    } else {
      render();
    }
  });
}

function bindAccount(){
  qsa('[data-acc-tab]').forEach(b=>b.addEventListener('click',()=>{ state.accountTab=b.dataset.accTab; render(); }));
}

/* =========================================================
   ADMIN PANEL
   ========================================================= */
function renderAdmin(section){
  const s = section || 'overview';
  const menu = [['overview','Overview'],['users','Users'],['hotels','Hotels'],['flights','Flights'],['packages','Packages'],['bookings','Bookings'],['reviews','Reviews']];
  const bodies = {
    overview: `
      <h2 class="font-semibold text-slate-900 mb-4">Overview</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        ${[['Total bookings',state.bookings.length],['Hotels listed',HOTELS.length],['Packages listed',PACKAGES.length],['Active flights',FLIGHTS.length]].map(([l,v])=>`
          <div class="border border-slate-100 rounded-xl p-4"><div class="text-2xl font-bold text-slate-900">${v}</div><div class="text-xs text-slate-400 mt-1">${l}</div></div>`).join('')}
      </div>`,
    users: `
      <h2 class="font-semibold text-slate-900 mb-4">Users</h2>
      <table class="w-full text-sm"><thead><tr class="text-left text-xs text-slate-400 border-b border-slate-100"><th class="py-2">Name</th><th>Email</th><th>Status</th></tr></thead>
      <tbody>
      ${(state.user? [state.user] : []).map(u=>`<tr class="border-b border-slate-50"><td class="py-2 font-medium text-slate-700">${u.name}</td><td class="text-slate-500">${u.email}</td><td><span class="text-emerald-600 text-xs font-semibold">Active</span></td></tr>`).join('')}
      ${['Priya Nair','Vikram Rao','Emma Wilson'].map(n=>`<tr class="border-b border-slate-50"><td class="py-2 font-medium text-slate-700">${n}</td><td class="text-slate-500">${n.toLowerCase().replace(' ','.')}@example.com</td><td><span class="text-emerald-600 text-xs font-semibold">Active</span></td></tr>`).join('')}
      </tbody></table>`,
    hotels: `
      <h2 class="font-semibold text-slate-900 mb-4">Hotels</h2>
      <table class="w-full text-sm"><thead><tr class="text-left text-xs text-slate-400 border-b border-slate-100"><th class="py-2">Name</th><th>Location</th><th>Rating</th><th>Price/night</th></tr></thead>
      <tbody>${HOTELS.map(h=>`<tr class="border-b border-slate-50"><td class="py-2 font-medium text-slate-700">${h.name}</td><td class="text-slate-500">${h.location}</td><td class="text-slate-500">${h.rating}</td><td class="text-slate-500">${money(h.price)}</td></tr>`).join('')}</tbody></table>`,
    flights: `
      <h2 class="font-semibold text-slate-900 mb-4">Flights</h2>
      <table class="w-full text-sm"><thead><tr class="text-left text-xs text-slate-400 border-b border-slate-100"><th class="py-2">Airline</th><th>Departure</th><th>Arrival</th><th>Price</th></tr></thead>
      <tbody>${FLIGHTS.map(f=>`<tr class="border-b border-slate-50"><td class="py-2 font-medium text-slate-700">${f.airline}</td><td class="text-slate-500">${f.dep}</td><td class="text-slate-500">${f.arr}</td><td class="text-slate-500">${money(f.price)}</td></tr>`).join('')}</tbody></table>`,
    packages: `
      <h2 class="font-semibold text-slate-900 mb-4">Packages</h2>
      <table class="w-full text-sm"><thead><tr class="text-left text-xs text-slate-400 border-b border-slate-100"><th class="py-2">Name</th><th>Destination</th><th>Days</th><th>Price</th></tr></thead>
      <tbody>${PACKAGES.map(p=>`<tr class="border-b border-slate-50"><td class="py-2 font-medium text-slate-700">${p.name}</td><td class="text-slate-500">${p.destination}</td><td class="text-slate-500">${p.days}</td><td class="text-slate-500">${money(p.price)}</td></tr>`).join('')}</tbody></table>`,
    bookings: `
      <h2 class="font-semibold text-slate-900 mb-4">Bookings</h2>
      ${state.bookings.length===0 ? `<p class="text-sm text-slate-400">No bookings recorded yet in this session.</p>` :
      `<table class="w-full text-sm"><thead><tr class="text-left text-xs text-slate-400 border-b border-slate-100"><th class="py-2">Booking ID</th><th>Service</th><th>Traveller</th><th>Amount</th><th>Status</th></tr></thead>
      <tbody>${state.bookings.map(b=>`<tr class="border-b border-slate-50"><td class="py-2 font-medium text-slate-700">${b.id}</td><td class="text-slate-500">${b.title}</td><td class="text-slate-500">${b.traveller.name}</td><td class="text-slate-500">${money(b.price)}</td><td><span class="text-emerald-600 text-xs font-semibold">${b.status}</span></td></tr>`).join('')}</tbody></table>`}`,
    reviews: `<h2 class="font-semibold text-slate-900 mb-4">Reviews</h2><p class="text-sm text-slate-400">Review moderation queue is empty — this is where flagged guest reviews would appear.</p>`,
  };
  return `
  <section class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <h1 class="text-xl font-bold text-slate-900 mb-6">Admin panel</h1>
    <div class="grid grid-cols-1 md:grid-cols-[180px_1fr] gap-8">
      <aside class="space-y-1">
        ${menu.map(([id,label])=>`<button data-admin-tab="${id}" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium ${s===id?'bg-brand-50 text-brand-700':'text-slate-500 hover:bg-slate-50'}">${label}</button>`).join('')}
      </aside>
      <div class="border border-slate-100 rounded-xl p-5 overflow-x-auto">${bodies[s]}</div>
    </div>
  </section>`;
}
function bindAdmin(){
  qsa('[data-admin-tab]').forEach(b=>b.addEventListener('click',()=>{ state.adminTab=b.dataset.adminTab; render(); }));
}

/* =========================================================
   ROUTER
   ========================================================= */
function bindGlobalNav(){
  qsa('[data-nav]').forEach(el=>el.addEventListener('click',(e)=>{ e.preventDefault(); go(el.dataset.nav); }));
  qsa('[data-action="open-login"]').forEach(el=>el.addEventListener('click',()=>openLoginModal()));
  qsa('[data-action="logout"]').forEach(el=>el.addEventListener('click',()=>{ state.user=null; go('#/'); }));
  qsa('[data-action="toggle-mobile-nav"]').forEach(el=>el.addEventListener('click',()=>{ qs('#mobile-nav').classList.toggle('hidden'); }));
  qsa('[data-action="toggle-theme"]').forEach(el=>el.addEventListener('click', toggleDarkMode));
  qsa('[data-goto-destination]').forEach(el=>el.addEventListener('click',()=>{
    const d = el.dataset.gotoDestination;
    state.filters.packageCity = d; state.filters.hotel.city = d;
    go('#/packages');
  }));
  qs('[data-action="search-flights"]')?.addEventListener('click',()=>{
    const from = qs('[data-field="flight-from"]')?.value || state.flightSearch.from;
    const to = qs('[data-field="flight-to"]')?.value || state.flightSearch.to;
    const travellers = +(qs('[data-field="flight-travellers"]')?.value || state.flightSearch.travellers);
    const cabinClass = qs('[data-field="flight-cabin"]')?.value || state.flightSearch.cabinClass;
    state.flightSearch = { from, to, travellers, cabinClass };
    go('#/flights');
  });
  qs('[data-action="search-hotels"]')?.addEventListener('click',()=>{
    const dest = qs('[data-field="hotel-dest"]')?.value;
    if(dest) state.filters.hotel.city = dest;
    go('#/hotels');
  });
  qs('[data-action="search-packages"]')?.addEventListener('click',()=>{
    const dest = qs('[data-field="package-dest"]')?.value;
    if(dest) state.filters.packageCity = dest;
    go('#/packages');
  });
  qsa('[data-action="book"]').forEach(el=>el.addEventListener('click',()=>{
    const meta = el.dataset.meta ? JSON.parse(el.dataset.meta.replace(/&apos;/g,"'")) : null;
    startBooking(el.dataset.type, el.dataset.id, meta);
  }));
}

function render(){
  const hash = location.hash || '#/';
  const parts = hash.replace('#','').split('/').filter(Boolean); // e.g. ['hotel','h1']
  let body = '';

  if(parts.length===0){ body = renderHome(); }
  else if(parts[0]==='flights'){ body = renderFlights(); }
  else if(parts[0]==='hotels'){ body = renderHotelsResults(); }
  else if(parts[0]==='hotel'){ body = renderHotelDetail(parts[1]); }
  else if(parts[0]==='cabs'){ body = renderCabs(); }
  else if(parts[0]==='packages'){ body = renderPackages(); }
  else if(parts[0]==='package'){ body = renderPackageDetail(parts[1]); }
  else if(parts[0]==='about'){ body = renderAbout(); }
  else if(parts[0]==='activities'){ body = renderActivities(state.activityCat); }
  else if(parts[0]==='activity'){ body = renderActivityDetail(parts[1]); }
  else if(parts[0]==='guides'){ body = renderGuides(); }
  else if(parts[0]==='guide'){ body = renderGuideDetail(parts[1]); }
  else if(parts[0]==='more'){ body = renderMorePlaceholder(parts[1]); }
  else if(parts[0]==='booking'){ body = renderBooking(); }
  else if(parts[0]==='confirmation'){ body = renderConfirmation(); }
  else if(parts[0]==='account'){ body = renderAccount(state.accountTab); }
  else if(parts[0]==='admin'){ body = renderAdmin(state.adminTab); }
  else { body = notFound('Page'); }

  document.getElementById('app').innerHTML = renderHeader() + `<main class="min-h-[60vh] fade-in">${body}</main>` + renderFooter();

  bindGlobalNav();
  if(parts.length===0) bindHome();
  if(parts[0]==='flights') bindFlights();
  if(parts[0]==='hotels') bindHotelsResults();
  if(parts[0]==='packages') bindPackages();
  if(parts[0]==='activities') bindActivities();
  if(parts[0]==='booking') bindBooking();
  if(parts[0]==='account') bindAccount();
  if(parts[0]==='admin') bindAdmin();
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', ()=>{
  applyTheme();
  render();
  const btn = document.getElementById('scroll-top-btn');
  window.addEventListener('scroll', ()=>{
    const show = window.scrollY > 500;
    btn.classList.toggle('opacity-0', !show);
    btn.classList.toggle('pointer-events-none', !show);
    btn.classList.toggle('translate-y-2', !show);
  });
  btn.addEventListener('click', ()=> window.scrollTo({top:0, behavior:'smooth'}));
});
</script>
</body>
</html>
